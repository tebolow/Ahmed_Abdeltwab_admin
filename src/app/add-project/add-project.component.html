<main class="container">
  <section class="form-card" aria-labelledby="project-form-title">
    <h1 id="project-form-title">{{ projectId ? 'Edit Project' : 'Add New Project' }}</h1>

    @if (errorMessage) {
      <div class="status-banner error" role="alert">{{ errorMessage }}</div>
    }

    <form method="POST" class="contactForm" (submit)="saveProject($event)">
      <div class="field">
        <label for="proj-name">Project Name <span aria-hidden="true">*</span></label>
        <input id="proj-name" type="text" name="name" [value]="existingProject?.name || ''" placeholder="Project name" required />
      </div>

      <div class="field">
        <label for="proj-brief">Brief Summary <span aria-hidden="true">*</span></label>
        <input id="proj-brief" type="text" name="brief" [value]="existingProject?.brief || ''" placeholder="One-line summary" required />
      </div>

      <div class="field">
        <label for="proj-description">Detailed Description <span aria-hidden="true">*</span></label>
        <textarea id="proj-description" name="description" rows="5" [value]="existingProject?.description || ''" placeholder="Full project overview" required></textarea>
      </div>

      <div class="field">
        <label for="proj-category">Category <span aria-hidden="true">*</span></label>
        <input
          id="proj-category"
          type="text"
          name="category"
          list="category-suggestions"
          [value]="existingProject?.category || ''"
          placeholder="Web, Mobile, Desktop..."
          required
        />
        <datalist id="category-suggestions">
          @for (cat of categorySuggestions; track cat) {
            <option [value]="cat"></option>
          }
        </datalist>
      </div>

      <div class="media-grid">
        <div class="field">
          <label for="proj-thumb">Thumbnail Image {{ projectId ? '(optional to replace)' : '*' }}</label>
          @if (existingProject?.thumb) {
            <img class="preview-img" [src]="existingProject.thumb | mediaUrl" alt="Current thumbnail" />
          }
          <input id="proj-thumb" type="file" name="thumb" accept="image/*" [required]="!projectId" />
        </div>

        <div class="field">
          <label for="proj-imgs">Gallery Images {{ projectId ? '(optional to replace)' : '' }}</label>
          <input id="proj-imgs" type="file" name="imgs" accept="image/*" multiple />
        </div>

        <div class="field">
          <label for="proj-video">Demo Video (optional)</label>
          <input id="proj-video" type="file" name="video" accept="video/*,.mkv" />
        </div>
      </div>

      <div class="field">
        <label for="proj-skill">Skills / Tech Stack</label>
        <div class="skill-input-row">
          <input
            #skillField
            id="proj-skill"
            type="text"
            placeholder="Type a skill and press Enter"
            (keydown)="onSkillKeydown($event, skillField)"
          />
          <button type="button" class="add-skill-btn" (click)="addSkill(skillField)">Add</button>
        </div>

        <div class="skills">
          @for (skill of skills; track skill) {
            <span class="skill-chip">
              {{ skill }}
              <button type="button" class="remove-chip" (click)="removeSkill(skill)" [attr.aria-label]="'Remove ' + skill">×</button>
            </span>
          }
        </div>
      </div>

      <button type="submit" class="submitButton" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Saving...' : (projectId ? 'Update Project' : 'Save Project') }}
      </button>
    </form>
  </section>
</main>
