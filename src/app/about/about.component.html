<main class="container">
  <div class="mainContainer">
    <div class="aboutMe">About me</div>

    <div class="body">
      <div class="aboutLeftImage">
        <div class="lay">
          <div class="img">
            <img
              [src]="data?.aboutImage ? (staticURL + data.aboutImage) : './profile.JPG'"
              alt="About photo"
            />
          </div>
        </div>
      </div>

      <div class="aboutRightText">
        <h1>Curious about me? Here you have it:</h1>
        <p class="preserve">
          {{ data?.about || 'Add your bio in Site Data to see it here.' }}
        </p>
      </div>
    </div>
  </div>

  <div class="modify">
    <button type="button" class="modifyButton" (click)="modify()">
      Edit About Content
    </button>
  </div>
</main>
