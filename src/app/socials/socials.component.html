<div class="social-wrapper" [class.page-mode]="isAdminPage">
  @if (isAdminPage) {
    <div class="page-header">
      <h1>Social Media Links</h1>
      <button type="button" class="modifyButton" (click)="goToAddSocial()">+ Add Social</button>
    </div>
  }

  <div class="socialMedia">
    @for (social of socials; track social._id) {
      <div class="social-item">
        <a
          class="icon"
          [href]="social.link"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="social.name || 'Social link'"
          [title]="social.name || social.link"
        >
          @if (isSvg(social.icon)) {
            <span class="svg-slot" [innerHTML]="trustSvg(social.icon)"></span>
          } @else if (isUrl(social.icon)) {
            <img [src]="social.icon" [alt]="social.name || 'Social icon'" width="24" height="24" />
          } @else {
            <span class="text-badge">{{ social.name || social.icon }}</span>
          }
        </a>

        @if (isAdminPage) {
          <button
            type="button"
            class="delete-btn"
            (click)="deleteSocial(social)"
            [attr.aria-label]="'Delete ' + (social.name || 'social link')"
          >
            ×
          </button>
        }
      </div>
    }
  </div>
</div>
