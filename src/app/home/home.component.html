<main class="container">
  <div class="mainContainer">
    <div class="homeLeftText">
      <h1>{{ homeData?.name || "Hi, I'm Ahmed Abdeltwab 👋" }}</h1>
      <p>
        {{ homeData?.description || 'Configure your hero description in Site Data.' }}
      </p>

      <div class="iconWithTextContainer">
        <div class="iconWithText">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 21C15.5 17.4 19 14.1764 19 10.2C19 6.22355 15.866 3 12 3C8.13401 3 5 6.22355 5 10.2C5 14.1764 8.5 17.4 12 21Z" stroke-linecap="round" stroke-linejoin="round"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <p>{{ homeData?.location || 'Cairo, Egypt' }}</p>
        </div>

        <div class="iconWithText">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#10B981" aria-hidden="true">
            <circle cx="12" cy="12" r="8"></circle>
          </svg>
          <p>{{ homeData?.availability || 'Available for new projects' }}</p>
        </div>
      </div>

      <app-socials></app-socials>
    </div>

    <div class="homeRightImg">
      <div class="lay">
        <div class="img">
          <img
            [src]="homeData?.homeImage ? (homeData.homeImage | mediaUrl) : './square.jpeg'"
            alt="Profile hero photo"
          />
        </div>
      </div>
    </div>
  </div>

  <div class="modify">
    <button type="button" class="modifyButton" (click)="modify()">
      Edit Site Data
    </button>
  </div>
</main>
