<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Portfolio Admin CMS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script>
    try {
      const saved = localStorage.getItem("color-scheme");
      if (saved === "light" || saved === "dark") {
        document.querySelector('meta[name="color-scheme"]').content = saved;
      }
    } catch {}
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
